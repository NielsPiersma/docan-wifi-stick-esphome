# Example Home Assistant dashboard for four Docan packs (the "Packs" view
# shown in the README screenshots). Needs the custom cards button-card and
# apexcharts-card (HACS).
#
# Entity IDs follow the shared package: sensor.docan_pack_<n>_..., from the
# device name docan-pack-<n>. Adjust them if your devices are named
# differently. The summary card also uses the battery power and SoC of the
# inverter (sensor.inverter_battery_power, sensor.inverter_battery, from a
# Deye integration); replace or remove those if you use another inverter.
#
# Labels are in Dutch. Paste the whole file into a new dashboard:
# Edit dashboard > Raw
# configuration editor.
button_card_templates:
  neon:
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    variables:
      accent: '#00E5FF'
    styles:
      card:
      - background: 'radial-gradient(circle at 15% 0%, #1b2450 0%, #0b1022 65%)'
      - color: '#e8ecff'
      - border: '[[[ return ''1px solid '' + variables.accent + ''38''; ]]]'
      - border-radius: 18px
      - box-shadow: none
      - padding: 18px
      grid:
      - grid-template-areas: '"i n" "body body"'
      - grid-template-columns: 34px 1fr
      - grid-template-rows: min-content min-content
      name:
      - justify-self: start
      - font-size: 16px
      - font-weight: 700
      - letter-spacing: .3px
      - white-space: normal
      - text-align: left
      icon:
      - width: 26px
      - color: '[[[ return variables.accent; ]]]'
      custom_fields:
        body:
        - justify-self: stretch
        - width: 100%
        - text-align: left
        - white-space: normal
    extra_styles: |
      @keyframes flow { to { background-position: 200% 0; } }
      @keyframes glow { 0%,100% { box-shadow: 0 0 6px var(--c); } 50% { box-shadow: 0 0 22px var(--c); } }
      @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.25; } }
      @keyframes dash { to { stroke-dashoffset: -12; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes mv { to { background-position: 0 -34px; } }
      @keyframes pulse { 0%,100% { filter:brightness(1); } 50% { filter:brightness(1.6); } }
      .k { font-size:11px; letter-spacing:3px; opacity:.6; text-transform:uppercase; }
      .big { font-size:44px; font-weight:800; line-height:1.1; background:linear-gradient(90deg,var(--g1,#00e5ff),var(--g2,#ff4fd8)); -webkit-background-clip:text; background-clip:text; color:transparent; }
      .big small, .mid small { font-size:18px; }
      .mid { font-size:30px; font-weight:800; line-height:1.15; }
      .sub { opacity:.75; font-size:14px; margin-top:2px; }
      .note { opacity:.55; font-size:12px; margin-top:10px; line-height:1.4; white-space:normal; }
      .bar { height:8px; border-radius:6px; background:rgba(255,255,255,.08); margin-top:10px; overflow:hidden; }
      .bar > div { height:100%; border-radius:6px; background:linear-gradient(90deg,var(--g1,#00e5ff),var(--g2,#ff4fd8),var(--g1,#00e5ff)); background-size:200% 100%; animation:flow 4s linear infinite; }
      .bar.solid { height:6px; margin-top:4px; }
      .bar.solid > div { background:var(--c); box-shadow:0 0 8px var(--c); animation:none; }
      .r { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:5px 0; font-size:14px; }
      .r > span { opacity:.7; display:flex; align-items:center; gap:8px; }
      .r > span ha-icon { --mdc-icon-size:18px; color:var(--c,#8a93b8); opacity:1; }
      .r b { text-align:right; }
      .sep { border-top:1px solid rgba(255,255,255,.08); margin-top:8px; padding-top:8px; }
      .mode { display:flex; flex-direction:column; margin-top:12px; padding:8px 12px; border-radius:12px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); }
      .mode b { font-size:15px; letter-spacing:2px; display:flex; align-items:center; gap:6px; }
      .mode b ha-icon { --mdc-icon-size:20px; }
      .mode span { font-size:12px; opacity:.6; white-space:normal; }
      .mode.on { border-color:color-mix(in srgb, var(--c) 55%, transparent); box-shadow:0 0 14px color-mix(in srgb, var(--c) 25%, transparent); }
      .mode.on b { color:var(--c); }
      .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
      .chip { flex:1; min-width:62px; border-radius:10px; padding:6px 6px; text-align:center; background:color-mix(in srgb, var(--c) 12%, transparent); border:1px solid color-mix(in srgb, var(--c) 45%, transparent); }
      .chip span { display:block; font-size:10px; opacity:.6; letter-spacing:1px; text-transform:uppercase; }
      .chip b { font-size:14px; color:var(--c); white-space:nowrap; }
      .led { display:inline-block; flex:0 0 8px; width:8px; height:8px; border-radius:50%; background:#5c6378; }
      .led.on { background:#39ff88; box-shadow:0 0 8px #39ff88; animation:blink 1.6s infinite; }
      .led.bad { background:#ff3d71; box-shadow:0 0 10px #ff3d71; animation:blink .8s infinite; }
      table.t { width:100%; border-collapse:collapse; font-size:14px; margin-top:8px; }
      table.t th { font-weight:400; font-size:10px; letter-spacing:1px; text-transform:uppercase; opacity:.55; text-align:right; padding-bottom:4px; }
      table.t td { text-align:right; padding:6px 0; border-top:1px solid rgba(255,255,255,.06); }
      table.t th:first-child, table.t td:first-child { text-align:left; }
      table.t tr.win td { color:#39ff88; font-weight:700; text-shadow:0 0 10px rgba(57,255,136,.5); }
      .hero { display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:space-between; }
      .tot { flex:1 1 200px; min-width:180px; }
      .ring { width:104px; height:104px; flex:0 0 104px; border-radius:50%; background:conic-gradient(var(--c) var(--d), rgba(255,255,255,.08) 0); display:flex; align-items:center; justify-content:center; box-shadow:0 0 18px color-mix(in srgb, var(--c) 40%, transparent); }
      .ring > div { width:84px; height:84px; border-radius:50%; background:#0b1022; display:flex; flex-direction:column; align-items:center; justify-content:center; }
      .ring b { font-size:18px; color:var(--c); }
      .ring span { font-size:10px; letter-spacing:2px; opacity:.55; }
      .bw { position:relative; padding-top:9px; }
      .bw::before { content:''; position:absolute; top:0; left:50%; margin-left:-15px; width:30px; height:9px; border-radius:4px 4px 0 0; background:var(--c); }
      .bat { position:relative; width:80px; height:140px; border:3px solid var(--c); border-radius:14px; overflow:hidden; background:#0b1022; animation:glow 3s ease-in-out infinite; }
      .fill { position:absolute; left:0; right:0; bottom:0; background:linear-gradient(to top, color-mix(in srgb, var(--c) 30%, #0b1022), var(--c)); }
      .fill::before, .fill::after { content:''; position:absolute; left:50%; margin-left:-110px; width:220px; height:220px; border-radius:42%; }
      .fill::before { bottom:calc(100% - 9px); background:#0b1022; animation:spin 7s linear infinite; }
      .fill::after { bottom:calc(100% - 13px); background:rgba(11,16,34,.45); animation:spin 11s linear infinite reverse; }
      .fx { position:absolute; inset:0; z-index:1; pointer-events:none; }
      .fx.laden, .fx.ontladen { background:repeating-linear-gradient(0deg, transparent 0 14px, rgba(255,255,255,.14) 14px 17px); animation:mv 1.1s linear infinite; }
      .fx.ontladen { animation-direction:reverse; }
      .lbl { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; color:#fff; text-shadow:0 0 6px #000,0 0 2px #000; z-index:2; }
      .lbl small { font-size:14px; margin-left:1px; }
      .flow { position:relative; width:100%; aspect-ratio:3/2; margin-top:6px; }
      .flow svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
      .ln { fill:none; stroke:var(--c); stroke-width:3; stroke-linecap:round; vector-effect:non-scaling-stroke; stroke-dasharray:2 10; filter:drop-shadow(0 0 4px var(--c)); }
      .ln.in { animation:dash .9s linear infinite; }
      .ln.out { animation:dash .9s linear infinite reverse; }
      .ln.idle { opacity:.15; stroke-dasharray:none; filter:none; }
      .jn { fill:#e8ecff; filter:drop-shadow(0 0 6px #fff); }
      .fn { position:absolute; transform:translate(-50%,-50%); width:96px; padding:6px 2px; border-radius:14px; text-align:center; background:rgba(11,16,34,.94); border:1px solid color-mix(in srgb, var(--c) 55%, transparent); box-shadow:0 0 14px color-mix(in srgb, var(--c) 30%, transparent); z-index:1; line-height:1.2; }
      .fn ha-icon { --mdc-icon-size:22px; color:var(--c); }
      .fn .fv { font-size:15px; font-weight:800; color:var(--c); white-space:nowrap; }
      .fn .fl { font-size:9px; letter-spacing:2px; opacity:.6; }
      .fn.zon { left:50%; top:18%; } .fn.net { left:17%; top:50%; } .fn.acc { left:83%; top:50%; } .fn.huis { left:50%; top:82%; }
      .g3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:12px; }
      .pc { border-radius:12px; padding:8px; background:color-mix(in srgb, var(--c) 8%, transparent); border:1px solid color-mix(in srgb, var(--c) 40%, transparent); }
      .pc .pn { font-size:12px; letter-spacing:3px; font-weight:800; color:var(--c); }
      .pc .pd { font-size:10px; letter-spacing:1px; opacity:.7; margin-top:2px; white-space:nowrap; }
      .pc .pv { font-size:18px; font-weight:800; margin:2px 0 4px; white-space:nowrap; }
      .pc .r { font-size:12px; padding:2px 0; gap:4px; }
      .strip { display:flex; align-items:flex-end; gap:2px; height:56px; margin-top:12px; }
      .strip i { flex:1; border-radius:3px 3px 1px 1px; background:var(--c); box-shadow:0 0 6px color-mix(in srgb, var(--c) 60%, transparent); opacity:.85; }
      .strip i.now { opacity:1; outline:1px solid #fff; }
      .sl { display:flex; justify-content:space-between; font-size:10px; opacity:.5; margin-top:4px; }
      .pl { padding:4px 0; }
      .pl .r { padding:0; font-size:13px; }
      .stack { display:flex; height:14px; border-radius:7px; overflow:hidden; margin-top:12px; background:rgba(255,255,255,.08); }
      .stack i { display:block; height:100%; background:var(--c); box-shadow:0 0 10px var(--c); }


      /* Calm typography and predictable alignment. */
      .big { font-size:clamp(30px,5vw,42px); line-height:1.15; font-variant-numeric:tabular-nums; }
      .mid { font-size:28px; font-variant-numeric:tabular-nums; }
      .k { letter-spacing:1.6px; opacity:.78; }
      .r { align-items:flex-start; gap:14px; padding:7px 0; line-height:1.45; }
      .r > span { opacity:.85; min-width:0; }
      .r b { flex-shrink:0; font-variant-numeric:tabular-nums; }
      .sub { opacity:.86; line-height:1.45; }
      .note { opacity:.72; font-size:12px; line-height:1.6; }
      .chips { gap:8px; }
      .chip { padding:9px 7px; min-width:75px; }
      .chip span { opacity:.8; letter-spacing:.5px; }
      .chip b { font-variant-numeric:tabular-nums; }
      .led.on, .led.bad, .bat, .bar > div { animation:none; }
      .led.on, .led.bad { box-shadow:none; }
      .packs { gap:16px; }
      table.t { font-variant-numeric:tabular-nums; }
      table.t th { opacity:.82; }
      .diag-scroll { overflow-x:auto; max-width:100%; -webkit-overflow-scrolling:touch; }
      .diag-scroll table { min-width:700px; }
      .load-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px; }
      .load-kpi { padding:12px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.035); }
      .load-kpi span { display:block;font-size:12px;opacity:.8;margin-bottom:5px; }
      .load-kpi b { display:block;font-size:25px;font-variant-numeric:tabular-nums;color:var(--c,#e8ecff); }
      @media (max-width:440px) {
       .r { font-size:13px;gap:8px; }
       .r > span { max-width:65%; }
       .chip b { font-size:13px; }
       .fn { width:82px; }
       .fn .fv { font-size:14px; }
       .fn .fl { letter-spacing:1px; }
       .packs { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:20px 10px; }
       .load-kpi b { font-size:22px; }
      }
      @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; } }
  neon_hero:
    template: neon
    show_icon: false
    show_name: false
    styles:
      grid:
      - grid-template-areas: '"body"'
      - grid-template-columns: 1fr
      - grid-template-rows: min-content
  neon_pack_cells:
    custom_fields:
      body: |-
        [[[
        const pre = variables.pack_prefix;
        const n = id => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : null; };
        const cnt = n(pre + 'cell_count') ?? 16;
        const cells = Array.from({length: cnt}, (_, i) => n(pre + 'cell_' + String(i + 1).padStart(2, '0') + '_voltage'));
        const ok = cells.filter(v => v !== null);
        if (!ok.length) return '<div style="opacity:.6;padding:20px 0;">Geen celdata</div>';
        const mn = Math.min(...ok), mx = Math.max(...ok);
        const avg = ok.reduce((a, b) => a + b, 0) / ok.length;
        const span = Math.max(mx - mn, 0.010);
        const delta = n(pre + 'cell_voltage_delta') ?? (mx - mn) * 1000;
        const packV = ok.reduce((a, b) => a + b, 0);
        const I = n(pre + 'pack_current');
        const lim = ((I, vmax) => (vmax !== null && vmax >= 3.45) ? 30 : 10 + Math.abs(I ?? 0))(I, mx);
        const col = v => { const d = Math.abs(v - avg) * 1000; return d <= lim / 2 ? '#39ff88' : d <= lim * 1.25 ? '#ffaa00' : '#ff3d71'; };
        const iMx = cells.indexOf(mx), iMn = cells.indexOf(mn);
        const bars = cells.map((v, i) => {
          if (v === null) return `<div class="c"><div class="b" style="height:8%;--k:#5c6378"></div></div>`;
          const h = 30 + 70 * (v - mn) / span;
          const tag = mx === mn ? '' : i === iMx ? '▲' : i === iMn ? '▼' : '';
          return `<div class="c" title="Cel ${i + 1}: ${v.toFixed(3)} V"><div class="b ${tag ? 'x' : ''}" style="height:${h}%;--k:${col(v)}"><em>${tag}</em></div></div>`;
        }).join('');
        const lbls = cells.map((_, i) => `<i>${i + 1}</i>`).join('');
        const flow = I === null || Math.abs(I) < 0.5 ? 'in rust' : `bij ${Math.abs(I).toFixed(0)} A`;
        const phase = mx >= 3.45 ? `Top van de curve, hier telt de delta echt (grens ${lim.toFixed(0)} mV)`
          : avg < 3.10 ? `Onderkant van de curve, grens ${lim.toFixed(0)} mV ${flow}`
          : `LiFePO4-plateau, grens ${lim.toFixed(0)} mV ${flow}`;
        const dCol = delta <= lim ? '#39ff88' : delta <= lim * 2.5 ? '#ffaa00' : '#ff3d71';
        return `
          <div class="cells">${bars}</div>
          <div class="lb">${lbls}</div>
          <div class="st">
            <div><span>Pack</span><b>${packV.toFixed(2)} V</b></div>
            <div><span>Min</span><b>${mn.toFixed(3)}</b></div>
            <div><span>Gem</span><b>${avg.toFixed(3)}</b></div>
            <div><span>Max</span><b>${mx.toFixed(3)}</b></div>
            <div><span>Delta</span><b style="color:${dCol}">${delta.toFixed(0)} mV</b></div>
          </div>
          <div class="ph">${phase}</div>`;
        ]]]
  neon_pack_health:
    custom_fields:
      body: |-
        [[[
        const pre = variables.pack_prefix;
        const pn = (pre.match(/pack_(\d+)_$/) || [])[1];
        const find = (k, d = 'sensor') => {
          const exact = states[d + '.' + pre.replace(/^sensor\./, '') + k];
          if (exact) return exact;
          const re = new RegExp('^' + d + '\\.[a-z0-9_]*pack_' + pn + '_([a-z0-9_]*_)?' + k + '(_\\d+)?$');
          const m = Object.keys(states).filter(id => re.test(id));
          const live = m.filter(id => !['unavailable', 'unknown'].includes(states[id].state));
          const pick = live.length === 1 ? live : m.length === 1 ? m : [];
          return pick.length ? states[pick[0]] : undefined;
        };
        const n = k => { const v = parseFloat(find(k)?.state); return Number.isFinite(v) ? v : null; };
        const txt = k => { const v = find(k)?.state; return (v === undefined || v === 'unknown' || v === 'unavailable') ? null : v; };
        const soh = n('state_of_health');
        const cyc = n('cycle_count');
        const full = n('full_charge_capacity');
        const des = n('design_capacity');
        const temps = [1, 2, 3, 4].map(i => n('cell_temperature_' + i));
        const env = n('environment_temperature');
        const rv = n('raw_voltage_status');
        const rt = n('raw_temperature_status');
        const prot = txt('bms_protections');
        const warn = txt('bms_warnings');
        const bal = find('balancer_active', 'binary_sensor')?.state;
        const cells = txt('balancing_cells');
        const stTxt = (lbl, v, lvl) => `<div class="s ${v === null ? '' : v === 'OK' ? 'ok' : lvl}"><span>${lbl}</span><b>${v ?? '-'}</b></div>`;
        const fr = find('valid_frames');
        const last = fr ? new Date(fr.last_updated) : null;
        const live = last !== null && (Date.now() - last.getTime()) < 300000;
        const tCol = t => t === null ? '#5c6378' : (t < 0 || t > 45) ? '#ff3d71' : (t < 5 || t > 40) ? '#ffaa00' : '#39ff88';
        const eCol = t => t === null ? '#5c6378' : t < 45 ? '#39ff88' : t < 55 ? '#ffaa00' : '#ff3d71';
        const sohDeg = soh === null ? 0 : Math.max(0, Math.min(100, soh)) * 3.6;
        const capPct = (full !== null && des) ? full / des * 100 : null;
        const chip = (lbl, t, f = tCol) => `<div class="t" style="--k:${f(t)}"><span>${lbl}</span><b>${t === null ? '-' : t.toFixed(1)}°</b></div>`;
        const stat = (lbl, v, voltage = false) => {
          if (v === null) return `<div class="s"><span>${lbl}</span><b>-</b></div>`;
          const r = Math.round(v);
          const lvl = r === 0 ? 'ok' : (voltage && (r & 0x01)) ? 'bad' : 'warn';
          const t = r === 0 ? 'OK' : '0x' + r.toString(16).toUpperCase();
          return `<div class="s ${lvl}"><span>${lbl}</span><b>${t}</b></div>`;
        };
        const balTxt = bal === 'on' ? 'actief' + (cells && cells !== 'none' ? ' (' + cells + ')' : '') : bal === 'off' ? 'uit' : '-';
        return `
          <div class="hl">
            <div class="ring" style="--d:${sohDeg}deg"><div><b>${soh === null ? '-' : soh.toFixed(0)}%</b><span>SoH</span></div></div>
            <div class="kv">
              <div class="r"><span>Cycli</span><b>${cyc === null ? '-' : cyc.toFixed(0)}</b></div>
              <div class="r"><span>Vol / ontwerp</span><b>${full === null ? '-' : full.toFixed(1)} / ${des === null ? '-' : des.toFixed(0)} Ah</b></div>
              <div class="cb"><div style="width:${Math.min(capPct ?? 0, 100)}%"></div></div>
              <div class="cp">${capPct === null ? '' : capPct.toFixed(0) + '% van ontwerpcapaciteit'}</div>
            </div>
          </div>
          <div class="temps">${temps.map((t, i) => chip('T' + (i + 1), t)).join('')}${chip('Omg', env, eCol)}</div>
          <div class="sts">
            ${prot !== null ? stTxt('Beveiliging', prot, 'bad') : stat('Spanning', rv, true)}
            ${warn !== null ? stTxt('Waarschuwing', warn, 'warn') : stat('Temp', rt)}
            <div class="s ${bal === 'on' ? 'bl' : ''}"><span>Balancer</span><b>${balTxt}</b></div>
            <div class="s lv ${live ? 'on' : ''}"><span>Laatste frame</span><b><i></i>${last ? last.toLocaleTimeString('nl-NL') : '-'}</b></div>
          </div>`;
        ]]]
views:
- type: sections
  max_columns: 2
  title: Packs
  path: accu-packs
  icon: mdi:home-battery
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Thuisaccu
      icon: mdi:home-battery
    - type: custom:button-card
      template: neon_hero
      variables:
        accent: '#00E5FF'
      grid_options:
        columns: full
      triggers_update:
      - sensor.inverter_battery_power
      - sensor.inverter_battery
      - sensor.docan_pack_1_state_of_charge
      - sensor.docan_pack_1_remaining_capacity
      - sensor.docan_pack_1_full_charge_capacity
      - sensor.docan_pack_2_state_of_charge
      - sensor.docan_pack_2_remaining_capacity
      - sensor.docan_pack_2_full_charge_capacity
      - sensor.docan_pack_3_state_of_charge
      - sensor.docan_pack_3_remaining_capacity
      - sensor.docan_pack_3_full_charge_capacity
      - sensor.docan_pack_4_state_of_charge
      - sensor.docan_pack_4_remaining_capacity
      - sensor.docan_pack_4_full_charge_capacity
      custom_fields:
        body: |-
          [[[
          const PACKS = [1, 2, 3, 4];
          const COL = {1: '#00E5FF', 2: '#FF4FD8', 3: '#4DA3FF', 4: '#A78BFA'};
          const V_NOM = 51.2;
          const ROLE = {1: 'MASTER', 2: 'SLAVE', 3: 'SLAVE', 4: 'SLAVE'};
          const n = id => { const v = parseFloat(states[id]?.state); return Number.isFinite(v) ? v : null; };
          const PREFIX = {
            1: 'sensor.docan_pack_1_',
            2: 'sensor.docan_pack_2_',
            3: 'sensor.docan_pack_3_',
            4: 'sensor.docan_pack_4_'
          };
          const s = (p, k) => n(PREFIX[p] + k);
          const socCol = v => v === null ? '#5c6378' : v < 10 ? '#ff3d71' : v < 20 ? '#ffaa00' : '#39ff88';
          let tot = 0, totMax = 0, validE = 0, validMax = 0;
          const socs = [];
          const bp0 = (() => { const id = 'sensor.inverter_battery_power'; const value = n(id); return value === null ? null : states[id]?.attributes?.unit_of_measurement === 'kW' ? value * 1000 : value; })();
          const mode0 = bp0 === null ? 'onbekend' : bp0 < -50 ? 'laden' : bp0 > 50 ? 'ontladen' : 'rust';
          const packs = PACKS.map(p => {
            const soc = s(p, 'state_of_charge');
            const rem = s(p, 'remaining_capacity');
            const full = s(p, 'full_charge_capacity') ?? s(p, 'design_capacity');
            const e = rem === null ? null : rem * V_NOM / 1000;
            const m = full === null ? null : full * V_NOM / 1000;
            if (e !== null) { tot += e; validE++; }
            if (m !== null) { totMax += m; validMax++; }
            if (soc !== null) socs.push(soc);
            const pct = soc === null ? 0 : Math.max(0, Math.min(100, soc));
            return `
              <div class="pk">
                <div class="bw" style="--c:${socCol(soc)}">
                  <div class="bat">
                    <div class="fill" style="height:${pct}%"></div>
                    <div class="fx ${mode0}"></div>
                    <div class="lbl">${soc === null ? '-' : soc.toFixed(0)}<small>%</small></div>
                  </div>
                </div>
                <div class="pn" style="color:${COL[p]}">PACK ${p}</div>
                <div class="rl">${ROLE[p] ?? ''}</div>
                <div class="pe">${e === null ? '-' : e.toFixed(1)}<span> / ${m === null ? '-' : m.toFixed(1)} kWh</span></div>
              </div>`;
          }).join('');
          const complete = validE === 4 && validMax === 4; const totPct = complete && totMax > 0 ? tot / totMax * 100 : null;
          const bp = (() => { const id = 'sensor.inverter_battery_power'; const value = n(id); return value === null ? null : states[id]?.attributes?.unit_of_measurement === 'kW' ? value * 1000 : value; })();
          const deyeSoc = n('sensor.inverter_battery');
          const mode = bp === null ? 'onbekend' : bp < -50 ? 'laden' : bp > 50 ? 'ontladen' : 'rust';
          const kw = bp === null ? 0 : Math.abs(bp) / 1000;
          const hrs = !complete ? null : mode === 'laden' ? (totMax - tot) / kw : mode === 'ontladen' ? tot / kw : null;
          const eta = (hrs === null || !Number.isFinite(hrs)) ? '' : `${Math.floor(hrs)}u ${String(Math.round((hrs % 1) * 60)).padStart(2, '0')}m`;
          const mTxt = mode === 'laden' ? `LADEN ${kw.toFixed(1)} kW` : mode === 'ontladen' ? `ONTLADEN ${kw.toFixed(1)} kW` : mode === 'onbekend' ? 'ONBEKEND' : 'RUST';
          const mSub = mode === 'laden' ? `vol over ~${eta}` : mode === 'ontladen' ? `leeg over ~${eta}` : mode === 'onbekend' ? 'Geen vermogensmeting beschikbaar' : 'geen noemenswaardige stroom';
          const spread = socs.length > 1 ? Math.max(...socs) - Math.min(...socs) : null;
          const spCol = spread === null ? 'inherit' : spread <= 5 ? '#39ff88' : spread <= 12 ? '#ffaa00' : '#ff3d71';
          return `
            <div class="hero">
              <div class="tot">
                <div class="k">THUISACCU · OPGESLAGEN</div>
                <div class="big">${validE === 4 ? tot.toFixed(1) : '-'}<small> kWh</small></div>
                <div class="sub">van ${validMax === 4 ? totMax.toFixed(1) : '-'} kWh BMS-schatting · 64 kWh nominaal · ${totPct === null ? '-' : totPct.toFixed(0)}%</div>
                <div class="bar"><div style="width:${Math.max(0, Math.min(100, totPct ?? 0))}%"></div></div>
                <div class="mode ${mode}"><b>${mTxt}</b><span>${mSub}</span></div>
                <div class="sub2">SoC-verschil tussen packs <b style="color:${spCol}">${spread === null ? '-' : spread.toFixed(1) + '%'}</b> · Deye SoC <b>${deyeSoc === null ? '-' : deyeSoc.toFixed(0) + '%'}</b></div>
              </div>
              <div class="packs">${packs}</div>
            </div>`;
          ]]]
      extra_styles: |
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes glow { 0%,100% { box-shadow: 0 0 6px var(--c); } 50% { box-shadow: 0 0 22px var(--c); } }
        @keyframes flow { to { background-position: 200% 0; } }
        @keyframes mv { to { background-position:0 -34px; } }
        .hero { display:flex; flex-wrap:wrap; gap:24px; align-items:center; justify-content:space-between; }
        .tot { flex:1 1 220px; min-width:200px; }
        .k { font-size:11px; letter-spacing:3px; opacity:.6; }
        .big { font-size:48px; font-weight:800; line-height:1.1; background:linear-gradient(90deg,#00e5ff,#ff4fd8); -webkit-background-clip:text; background-clip:text; color:transparent; }
        .big small { font-size:18px; }
        .sub { opacity:.75; font-size:14px; margin-top:2px; }
        .sub2 { opacity:.85; font-size:13px; margin-top:10px; }
        .bar { height:8px; border-radius:6px; background:rgba(255,255,255,.08); margin-top:10px; overflow:hidden; }
        .bar div { height:100%; border-radius:6px; background:linear-gradient(90deg,#00e5ff,#ff4fd8,#00e5ff); background-size:200% 100%; animation:flow 4s linear infinite; }
        .packs { display:flex; gap:26px; flex-wrap:wrap; justify-content:center; }
        .pk { display:flex; flex-direction:column; align-items:center; gap:3px; }
        .bw { position:relative; padding-top:9px; }
        .bw::before { content:''; position:absolute; top:0; left:50%; margin-left:-15px; width:30px; height:9px; border-radius:4px 4px 0 0; background:var(--c); }
        .bat { position:relative; width:80px; height:140px; border:3px solid var(--c); border-radius:14px; overflow:hidden; background:#0b1022; animation:glow 3s ease-in-out infinite; }
        .fill { position:absolute; left:0; right:0; bottom:0; background:linear-gradient(to top, color-mix(in srgb, var(--c) 30%, #0b1022), var(--c)); }
        .fill::before, .fill::after { content:''; position:absolute; left:50%; margin-left:-110px; width:220px; height:220px; border-radius:42%; }
        .fill::before { bottom:calc(100% - 9px); background:#0b1022; animation:spin 7s linear infinite; }
        .fill::after { bottom:calc(100% - 13px); background:rgba(11,16,34,.45); animation:spin 11s linear infinite reverse; }
        .fx { position:absolute; inset:0; z-index:1; pointer-events:none; }
        .fx.laden, .fx.ontladen { background:repeating-linear-gradient(0deg, transparent 0 14px, rgba(255,255,255,.14) 14px 17px); animation:mv 1.1s linear infinite; }
        .fx.ontladen { animation-direction:reverse; }
        .mode { display:flex; flex-direction:column; margin-top:12px; padding:8px 12px; border-radius:12px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); }
        .mode b { font-size:15px; letter-spacing:2px; }
        .mode span { font-size:12px; opacity:.6; }
        .mode.laden { border-color:rgba(0,229,255,.5); box-shadow:0 0 14px rgba(0,229,255,.25); }
        .mode.laden b { color:#00e5ff; }
        .mode.ontladen { border-color:rgba(77,163,255,.5); box-shadow:0 0 14px rgba(77,163,255,.25); }
        .mode.ontladen b { color:#4da3ff; }
        .lbl { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:800; color:#fff; text-shadow:0 0 6px #000,0 0 2px #000; z-index:2; }
        .lbl small { font-size:14px; margin-left:1px; }
        .pn { font-size:11px; letter-spacing:3px; font-weight:700; margin-top:6px; }
        .rl { font-size:9px; letter-spacing:2px; opacity:.5; margin-top:-2px; }
        .pe { font-size:15px; font-weight:700; }
        .pe span { font-weight:400; opacity:.6; font-size:12px; }


        /* Calm typography and predictable alignment. */
        .big { font-size:clamp(30px,5vw,42px); line-height:1.15; font-variant-numeric:tabular-nums; }
        .mid { font-size:28px; font-variant-numeric:tabular-nums; }
        .k { letter-spacing:1.6px; opacity:.78; }
        .r { align-items:flex-start; gap:14px; padding:7px 0; line-height:1.45; }
        .r > span { opacity:.85; min-width:0; }
        .r b { flex-shrink:0; font-variant-numeric:tabular-nums; }
        .sub { opacity:.86; line-height:1.45; }
        .note { opacity:.72; font-size:12px; line-height:1.6; }
        .chips { gap:8px; }
        .chip { padding:9px 7px; min-width:75px; }
        .chip span { opacity:.8; letter-spacing:.5px; }
        .chip b { font-variant-numeric:tabular-nums; }
        .led.on, .led.bad, .bat, .bar > div { animation:none; }
        .led.on, .led.bad { box-shadow:none; }
        .packs { gap:16px; }
        table.t { font-variant-numeric:tabular-nums; }
        table.t th { opacity:.82; }
        .diag-scroll { overflow-x:auto; max-width:100%; -webkit-overflow-scrolling:touch; }
        .diag-scroll table { min-width:700px; }
        .load-grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px; }
        .load-kpi { padding:12px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.035); }
        .load-kpi span { display:block;font-size:12px;opacity:.8;margin-bottom:5px; }
        .load-kpi b { display:block;font-size:25px;font-variant-numeric:tabular-nums;color:var(--c,#e8ecff); }
        @media (max-width:440px) {
         .r { font-size:13px;gap:8px; }
         .r > span { max-width:65%; }
         .chip b { font-size:13px; }
         .fn { width:82px; }
         .fn .fv { font-size:14px; }
         .fn .fl { letter-spacing:1px; }
         .packs { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:20px 10px; }
         .load-kpi b { font-size:22px; }
        }
        @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; } }
