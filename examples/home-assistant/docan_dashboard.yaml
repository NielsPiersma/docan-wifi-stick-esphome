      custom_fields:
        body: |-
          [[[
          const P = [
            { n: 1, pre: 'docan_pack_1_', c: '#00E5FF', role: 'MASTER' },
            { n: 2, pre: 'docan_pack_2_', c: '#FF4FD8', role: 'SLAVE' },
            { n: 3, pre: 'docan_pack_3_', c: '#4DA3FF', role: 'SLAVE' },
            { n: 4, pre: 'docan_pack_4_', c: '#A78BFA', role: 'SLAVE' }
          ];
          const bad = ['unknown', 'unavailable', '', undefined];
          const ids = Object.keys(states);
          const e = (p, k, d = 'sensor') => {
            const exact = states[`${d}.${p.pre}${k}`];
            if (exact) return exact;
            const pattern = new RegExp(`^${d}\\.[a-z0-9_]*pack_${p.n}_([a-z0-9_]*_)?${k}(_\\d+)?$`);
            const matches = Object.keys(states).filter(id => pattern.test(id));
            return matches.length === 1 ? states[matches[0]] : undefined;
          };
          const t = (p, k) => { const s = e(p, k)?.state; return bad.includes(s) ? null : s; };
          const n = (p, k) => { const v = parseFloat(e(p, k)?.state); return Number.isFinite(v) ? v : null; };
          const dash = '<span style="opacity:.4">-</span>';
          const hx = v => '0x' + Math.round(v).toString(16).toUpperCase().padStart(2, '0');
          const tag = (txt, c) => `<b style="color:${c}">${txt}</b>`;
          const hex = v => v === null ? dash : v === 0 ? tag('OK', '#39ff88') : tag(hx(v), '#ffaa00');
          const vst = v => v === null ? dash : v === 0 ? tag('OK', '#39ff88')
            : (Math.round(v) & 0x01) ? tag(hx(v) + ' laadstop', '#ff3d71') : tag(hx(v) + ' hoog', '#ffaa00');

          const FET_OK = [0x1023, 0x23];
          const fet = v => v === null ? dash : FET_OK.includes(Math.round(v)) ? tag(hx(v), '#39ff88') : tag(hx(v), '#ffaa00');
          const socCol = v => v < 10 ? '#ff3d71' : v < 20 ? '#ffaa00' : '#39ff88';
          const sv = (p, k) => { const v = n(p, k); return v === null ? null : (Number.isInteger(v) ? v.toFixed(0) : v.toFixed(1)); };
          const setKey = (p, a, b) => `${sv(p, a)}|${sv(p, b)}`;
          const set2 = (p, a, b, u, ua = '', ub = '') => {
            const x = sv(p, a), y = sv(p, b);
            if (x === null && y === null) return dash;
            const all = P.map(q => setKey(q, a, b)).filter(k => !k.includes('null'));
            const same = new Set(all).size <= 1;
            const txt = `${x ?? '-'}${ua} / ${y ?? '-'}${ub}${u ? ' ' + u : ''}`;
            return same ? txt : tag(txt, '#ffaa00');
          };
          const rows = [
            ['Communicatie', p => {
              const s = e(p, 'bms_communication', 'binary_sensor')?.state;
              const cls = s === 'on' ? 'on' : (s === 'off' ? 'bad' : '');
              return `<span style="display:inline-flex;align-items:center;gap:6px;"><i class="led ${cls}"></i>${s === 'on' ? 'OK' : s === 'off' ? 'WEG' : '-'}</span>`;
            }],
            ['Serienummer', p => { const v = t(p, 'serial_number'); return v ? `<b style="font-family:monospace;letter-spacing:.5px;">${v}</b>` : dash; }],
            ['Productiedatum', p => t(p, 'production_date') ?? dash],
            ['Model', p => t(p, 'bms_model') ?? dash],
            ['Firmware / HW', p => { const f = t(p, 'bms_firmware'), h = t(p, 'bms_hardware'); return f || h ? `${f ?? '-'} / ${h ?? '-'}` : dash; }],
            ['Adres / pack', p => { const a = n(p, 'detected_bms_address'), k = n(p, 'detected_pack_number'); return a === null ? dash : `${a.toFixed(0)} / ${k === null ? '-' : k.toFixed(0)}`; }],
            ['Frames ok / fout', p => {
              const ok = n(p, 'valid_frames'), ko = n(p, 'invalid_frames');
              const rate = (ok && ko !== null) ? ko / (ok + ko) : 0;
              const fc = !ko ? '#39ff88' : rate < 0.001 ? '#39ff88' : rate < 0.01 ? '#ffaa00' : '#ff3d71';
              return ok === null ? dash : `${ok.toFixed(0)} / <span style="color:${fc}">${ko === null ? '-' : ko.toFixed(0)}</span>`;
            }],
            ['Beveiligingen', p => { const v = t(p, 'bms_protections'); return v === null ? dash : v === 'OK' ? tag('OK', '#39ff88') : tag(v, '#ff3d71'); }],
            ['Waarschuwingen', p => { const v = t(p, 'bms_warnings'); return v === null ? dash : v === 'OK' ? tag('OK', '#39ff88') : tag(v, '#ffaa00'); }],
            ['Balancer', p => { const a = e(p, 'balancer_active', 'binary_sensor')?.state; const c = t(p, 'balancing_cells'); return a === 'on' ? tag('actief' + (c && c !== 'none' ? ' (cel ' + c + ')' : ''), '#00E5FF') : a === 'off' ? '<span style="opacity:.6">uit</span>' : dash; }],
            ['FET-status', p => fet(n(p, 'raw_fet_status'))],
            ['Laatste frame', p => {
              const s = e(p, 'valid_frames');
              if (!s) return dash;
              const d = new Date(s.last_updated);
              const age = (Date.now() - d.getTime()) / 1000;
              const c = age < 60 ? '#39ff88' : age < 300 ? '#ffaa00' : '#ff3d71';
              return `<span style="color:${c}">${d.toLocaleTimeString('nl-NL')}</span>`;
            }],
            ['Stroom', p => {
              const I = n(p, 'pack_current');
              if (I === null) return dash;
              const all = P.map(q => n(q, 'pack_current')).filter(v => v !== null);
              const avg = all.length ? all.reduce((x, y) => x + y, 0) / all.length : I;
              const dev = Math.abs(avg) > 5 ? Math.abs(I - avg) / Math.abs(avg) : 0;
              const c = dev <= 0.2 ? '#39ff88' : dev <= 0.4 ? '#ffaa00' : '#ff3d71';
              const dir = I > 0.5 ? 'laden' : I < -0.5 ? 'ontladen' : 'rust';
              return `<b style="color:${c};font-size:15px;">${I.toFixed(1)} A</b> <span style="opacity:.55;font-size:11px;">${dir}</span>`;
            }, true],
            ['Lading', p => {
              const v = n(p, 'state_of_charge');
              if (v === null) return dash;
              const c = socCol(v);
              const w = Math.max(0, Math.min(100, v));
              return `<span style="display:inline-flex;align-items:center;gap:8px;"><span style="display:inline-block;width:46px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;"><span style="display:block;height:100%;width:${w}%;background:${c};box-shadow:0 0 6px ${c};"></span></span><b style="color:${c};font-size:15px;">${v.toFixed(1)}%</b></span>`;
            }],
            ['Celdelta', p => {
              const d = n(p, 'cell_voltage_delta');
              if (d === null) return dash;
              const lim = ((I, vmax) => (vmax !== null && vmax >= 3.45) ? 30 : 10 + Math.abs(I ?? 0))(n(p, 'pack_current'), n(p, 'highest_cell_voltage'));
              const c = d <= lim ? '#39ff88' : d <= lim * 2.5 ? '#ffaa00' : '#ff3d71';
              return `<b style="color:${c};font-size:15px;">${d.toFixed(0)} mV</b>`;
            }],
            ['Balancer start', p => set2(p, 'bms_balancer_start_voltage', 'bms_balancer_start_difference', 'mV'), true],
            ['Cel hoog alarm / beveil.', p => set2(p, 'bms_cell_overvoltage_alarm', 'bms_cell_overvoltage_protection', 'mV')],
            ['Laadspanning / -stroom', p => set2(p, 'bms_charge_voltage', 'bms_charge_current_limit', '', ' V', ' A')]
          ];
          const head = `<tr><th></th>${P.map(p => `<th style="color:${p.c};opacity:1;font-weight:700;letter-spacing:2px;">PACK ${p.n}<br><span style="font-size:9px;opacity:.6;font-weight:400;">${p.role}</span></th>`).join('')}</tr>`;
          const body = rows.map(([l, f, sep]) => {
            const st = sep ? ' style="border-top:1px solid rgba(255,255,255,.22);padding-top:10px;"' : '';
            return `<tr><td${st}>${l}</td>${P.map(p => `<td${st}>${f(p)}</td>`).join('')}</tr>`;
          }).join('');
          const serials = P.map(p => t(p, 'serial_number')).filter(Boolean);
          const dupes = serials.length !== new Set(serials).size;
          return `
            <div style="overflow-x:auto;">
              <div class="diag-scroll"><table class="t" style="font-size:13px;white-space:nowrap;">${head}${body}</table></div>
            </div>
            ${dupes ? '<div class="mode on" style="--c:#ff3d71"><b>DUBBEL SERIENUMMER</b><span>Twee sticks lezen hetzelfde pack uit, controleer de bekabeling</span></div>' : ''}
            <div class="note">Beveiligingen (rood) en waarschuwingen (oranje) zijn de statusbits van de BMS, vertaald met de betekenis uit de DR BMS Monitor-software. Balancer actief = de BMS meldt dat hij balanceert, met de cel die hij bijwerkt. BMS-instellingen worden elk uur uit de BMS gelezen, oranje = de packs hebben verschillende waarden. De productiedatum valt steeds enkele dagen na de datum in het serienummer. Groen = in orde, oranje = waarschuwing, rood = probleem. Stroom: groen als een pack binnen 20% van het gemiddelde van de vier zit, oranje tot 40%, daarboven rood (wijst op een slechter contact of afwijkend pack). Celdelta: de grens is 10 mV + 1 mV per ampère laad- of ontlaadstroom (stroom geeft altijd wat spreiding), en 30 mV zodra de hoogste cel boven 3,45 V komt. Oranje tot 2,5× de grens, daarboven rood. FET 0x1023 en 0x23 zijn normaal.</div>`;
          ]]]
